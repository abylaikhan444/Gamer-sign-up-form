<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />
    <title>Frontend Mentor | Gamer sign-up form</title>
  </head>
  <body>
    <div class="page">
      <!-- Блок: Левая колонка (Brand Panel) -->
      <aside class="brand-panel">
        <img class="brand-panel__logo" src="/assets/images/logo.svg" alt="NEONCORE logo" />

        <h1 class="brand-panel__title">JOIN THE <br /> NEXUS</h1>
        <p class="brand-panel__desc">INITIALIZE YOUR NEONCORE IDENTITY</p>

        <div class="operator-panel">
          <div class="operator-panel__header">
            <span class="operator-panel__label">OPERATOR ID</span>
            <span class="operator-panel__count">0/5 READY</span>
          </div>
          <h2 class="operator-panel__name">UNASSIGNED</h2>
          <ul class="status-list">
            <li class="status-list__row">
              <span class="status-list__label">CALLSIGN</span>
              <span class="status-list__value">PENDING</span>
            </li>
            <li class="status-list__row">
              <span class="status-list__label">EMAIL</span>
              <span class="status-list__value">PENDING</span>
            </li>
            <li class="status-list__row">
              <span class="status-list__label">PASSWORD</span>
              <span class="status-list__value">PENDING</span>
            </li>
            <li class="status-list__row">
              <span class="status-list__label">CONFIRM</span>
              <span class="status-list__value">PENDING</span>
            </li>
            <li class="status-list__row">
              <span class="status-list__label">TERMS</span>
              <span class="status-list__value">REQUIRED</span>
            </li>
          </ul>
        </div>
      </aside>
      <!-- Правая колонка: форма -->
      <main class="form-panel">RIGHT SIDE</main>
    </div>
    <!-- <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by
      <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
